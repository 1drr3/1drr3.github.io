<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00b278">
<title>小哈AI写作 · 小说生成与编辑</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2300b278'/%3E%3Ctext x='50' y='72' font-size='58' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%E7%AC%94%3C/text%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#f5f7fa}
  #app{
    width:100%;height:100vh;height:100dvh;border:0;display:block;
    opacity:0;transition:opacity .3s ease;
  }
  #app.ready{opacity:1}
  #loading{
    position:fixed;inset:0;z-index:9;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#f5f7fa;color:#5a6478;
    font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    transition:opacity .35s ease;
  }
  #loading.out{opacity:0;pointer-events:none}
  .spinner{
    width:34px;height:34px;border-radius:50%;
    border:3px solid #dfe5ee;border-top-color:#00b278;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .brand{font-size:15px;font-weight:600;color:#2b3345;letter-spacing:.5px}
  .brand em{font-style:normal;color:#00b278}
  #fallback{display:none;text-align:center;padding:0 24px;max-width:520px}
  #fallback p{margin-bottom:10px}
  #fallback a{color:#00b278;text-decoration:none;word-break:break-all;font-weight:500}
  #fallback a:hover{text-decoration:underline}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div class="brand">小哈<em>AI</em>写作</div>
  <div id="tip">正在载入写作工作台…</div>
  <div id="fallback">
    <p>载入时间有点长，可能是网络较慢。</p>
    <a href="https://biling-ai-writing.app.workbuddy.host/?sharecode=3QYPYOMQ2Q" target="_blank" rel="noopener">点此在新窗口直接打开 →</a>
  </div>
</div>

<iframe id="app"
        src="https://biling-ai-writing.app.workbuddy.host/?sharecode=3QYPYOMQ2Q"
        title="小哈AI写作"
        allow="clipboard-read; clipboard-write; fullscreen; downloads"
        referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
(function(){
  var f   = document.getElementById('app');
  var box = document.getElementById('loading');
  var tip = document.getElementById('tip');
  var fb  = document.getElementById('fallback');
  var done = false;

  function reveal(){
    if(done) return;
    done = true;
    f.classList.add('ready');
    box.classList.add('out');
    setTimeout(function(){ box.style.display='none'; }, 400);
  }

  // iframe 加载完成（跨域也能触发 load）
  f.addEventListener('load', function(){ setTimeout(reveal, 250); });

  // 慢网络提示
  var t1 = setTimeout(function(){
    if(!done){ fb.style.display='block'; tip.textContent='载入较慢，请稍候…'; }
  }, 9000);

  // 兜底：15 秒还没好就直接显示，并把入口亮出来
  var t2 = setTimeout(function(){
    if(!done){ fb.style.display='block'; reveal(); }
  }, 15000);
})();
</script>
</body>
</html>
