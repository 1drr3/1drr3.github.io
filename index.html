<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00b278">
<title>小哈AI写作 · 正在进入…</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2300b278'/%3E%3Ctext x='50' y='72' font-size='58' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%E5%B0%8F%3C/text%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#f5f7fa}
  body{display:flex;align-items:center;justify-content:center;
    font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:#5a6478}
  .box{text-align:center;padding:0 24px;max-width:480px}
  .spinner{width:34px;height:34px;border-radius:50%;margin:0 auto 18px;
    border:3px solid #dfe5ee;border-top-color:#00b278;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .brand{font-size:17px;font-weight:600;color:#2b3345;letter-spacing:.5px;margin-bottom:10px}
  .brand em{font-style:normal;color:#00b278}
  .tip{font-size:13px;color:#888;margin-bottom:22px}
  .btn{display:inline-block;padding:11px 22px;background:#00b278;color:#fff;border-radius:8px;
    text-decoration:none;font-size:14px;font-weight:500}
  .btn:hover{background:#009a69}
  .note{font-size:12px;color:#aaa;margin-top:16px}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <div class="brand">小哈<em>AI</em>写作</div>
  <div class="tip" id="tip">正在进入写作工作台…</div>
  <a class="btn" id="go" href="https://biling-ai-writing.app.workbuddy.host/?sharecode=3QYPYOMQ2Q">立即进入</a>
  <div class="note">为正常使用 WorkBuddy 登录与 AI 写作，将跳转到正式地址</div>
</div>
<script>
(function(){
  // 同 tab 跳转，OAuth 需要顶层窗口（iframe 里 PKCE/cookie 会被拦）
  var target='https://biling-ai-writing.app.workbuddy.host/?sharecode=3QYPYOMQ2Q';
  document.getElementById('go').href=target;
  location.replace(target);
})();
</script>
</body>
</html>
